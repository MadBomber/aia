# AIA v2 Configuration Schema and Defaults
#
# This file is the SINGLE SOURCE OF TRUTH for AIA configuration.
# All attributes must be declared here to be recognized.
# It is bundled with the gem and loaded automatically at lowest priority.
#
# Loading priority (lowest to highest):
# 1. This file (bundled defaults)
# 2. User config (~/.config/aia/aia.yml)
# 3. Environment variables (AIA_*)
# 4. CLI arguments
# 5. Embedded directives (/config)
#
# Environment Variable Naming:
# Use double underscore for nested keys:
#   AIA_LLM__TEMPERATURE=0.5
#   AIA_PROMPTS__DIR=~/my-prompts
#   AIA_FLAGS__DEBUG=true

defaults:
  service:
    name: aia

  # ---------------------------------------------------------------------------
  # LLM Configuration
  # Access: AIA.config.llm.temperature, etc.
  # Env: AIA_LLM__TEMPERATURE, etc.
  # ---------------------------------------------------------------------------
  llm:
    temperature: 0.7
    max_tokens: 32767
    top_p: ~ # nil by default — some models reject requests with both temperature AND top_p
    frequency_penalty: 0.0
    presence_penalty: 0.0

  # ---------------------------------------------------------------------------
  # Models Configuration
  # Access: AIA.config.models (array of ModelSpec objects)
  # Each model has: name, role, instance, internal_id
  #
  # Example YAML:
  #   models:
  #     - name: gpt-4o
  #       role: architect
  #     - name: claude-3-opus
  #       role: reviewer
  #
  # Example CLI: --model "gpt-4o=architect,claude-3-opus=reviewer"
  # ---------------------------------------------------------------------------
  models:
    - name: gpt-4o-mini
      role: ~

  # ---------------------------------------------------------------------------
  # Prompts Configuration
  # Access: AIA.config.prompts.dir, AIA.config.prompts.roles_prefix, etc.
  # Env: AIA_PROMPTS__DIR, AIA_PROMPTS__ROLES_PREFIX, etc.
  # ---------------------------------------------------------------------------
  prompts:
    dir: ~/.prompts
    extname: .md
    #
    role: ~
    roles_prefix: roles
    #
    skills: []
    #
    system_prompt: ~

  skills:
    dir: ~/.prompts/skills

  # ---------------------------------------------------------------------------
  # Output Configuration
  # Access: AIA.config.output.file, AIA.config.output.append, etc.
  # Env: AIA_OUTPUT__FILE, AIA_OUTPUT__APPEND, etc.
  # ---------------------------------------------------------------------------
  output:
    file: temp.md
    append: false
    history_file: ~/.prompts/_prompts.log

  # ---------------------------------------------------------------------------
  # Audio Configuration
  # Access: AIA.config.audio.voice, AIA.config.audio.speak_command, etc.
  # Env: AIA_AUDIO__VOICE, AIA_AUDIO__SPEAK_COMMAND, etc.
  # ---------------------------------------------------------------------------
  audio:
    voice: ~
    speak_command: say
    player: ~
    speech_model: ~
    transcription_model: ~

  # ---------------------------------------------------------------------------
  # Image Configuration
  # Access: AIA.config.image.model, AIA.config.image.size, etc.
  # Env: AIA_IMAGE__MODEL, AIA_IMAGE__SIZE, etc.
  # ---------------------------------------------------------------------------
  image:
    model: gpt-image-1
    size: 1024x1024
    quality: standard
    style: vivid

  # ---------------------------------------------------------------------------
  # Tools Configuration
  # Access: AIA.config.tools.paths, AIA.config.tools.allowed, etc.
  # Env: AIA_TOOLS__PATHS, AIA_TOOLS__ALLOWED, etc.
  # ---------------------------------------------------------------------------
  tools:
    paths: []
    allowed: ~
    rejected: ~
    # Tool calls that require approval (an MCP server's requires_approval:)
    # and MCP input requests: ask (prompt on the terminal; refuse when there
    # is none), approve (allow them all), or deny (refuse them all).
    approval: ask

  # ---------------------------------------------------------------------------
  # Flags (Boolean Options)
  # Access: AIA.config.flags.chat, AIA.config.flags.debug, etc.
  # Env: AIA_FLAGS__CHAT=true, AIA_FLAGS__DEBUG=true, etc.
  # ---------------------------------------------------------------------------
  flags:
    chat: false
    cost: false
    debug: false
    verbose: false
    fuzzy: false
    tokens: false
    no_mcp: false
    speak: false
    shell: true
    erb: true
    consensus: false
    track_pipeline: false
    auto_tool_filter: true
    allow_ruby_eval: false
    paint: false
    thinking: false

  # ---------------------------------------------------------------------------
  # Tool Filter Configuration
  # Access: AIA.config.tool_filter.timeout_s
  # Env: AIA_TOOL_FILTER__TIMEOUT_S
  # ---------------------------------------------------------------------------
  tool_filter:
    timeout_s: 10

  # ---------------------------------------------------------------------------
  # Logger Configuration
  # Access: AIA.config.logger.aia.file, AIA.config.logger.llm.level, etc.
  # Env: AIA_LOGGER__AIA__FILE, AIA_LOGGER__LLM__LEVEL, etc.
  # ---------------------------------------------------------------------------
  logger:
    aia:
      file: STDOUT
      level: warn
      flush: true
    llm:
      file: STDOUT
      level: warn
      flush: true
    mcp:
      file: STDOUT
      level: warn
      flush: true

  # ---------------------------------------------------------------------------
  # Pipeline/Workflow Configuration
  # Access: AIA.config.pipeline (array of prompt IDs)
  # ---------------------------------------------------------------------------
  pipeline: []

  # ---------------------------------------------------------------------------
  # Model Registry Configuration
  # Access: AIA.config.registry.refresh
  # Env: AIA_REGISTRY__REFRESH
  # ---------------------------------------------------------------------------
  registry:
    refresh: 7 # days between refreshes (0 = disable periodic refresh)

  # ---------------------------------------------------------------------------
  # Required Ruby Libraries
  # Access: AIA.config.require_libs (array)
  # ---------------------------------------------------------------------------
  require_libs: []

  # ---------------------------------------------------------------------------
  # MCP Servers Configuration
  # Access: AIA.config.mcp_servers (array of server configs)
  # ---------------------------------------------------------------------------
  mcp_servers: []
  mcp_use: ~
  mcp_skip: ~

  # ---------------------------------------------------------------------------
  # Paths Configuration
  # Access: AIA.config.paths.aia_dir, AIA.config.paths.plugins_dir
  # Env: AIA_PATHS__AIA_DIR
  # Special-case env: AIA_PLUGINS_DIR
  # ---------------------------------------------------------------------------
  paths:
    aia_dir: ~/.config/aia
    plugins_dir: ~

  # ---------------------------------------------------------------------------
  # Model Aliases (user-defined aliases override defaults)
  # Access: AIA.config.model_aliases
  # ---------------------------------------------------------------------------
  model_aliases: {}

  # ---------------------------------------------------------------------------
  # Model Switch History Mode
  # Controls conversation history transfer when switching models mid-chat.
  # Values: clean (fresh start), replay (re-send every user message to the
  # new model), summarize (old model summarizes; the new model gets the summary)
  # Used by the /model directive.
  # Access: AIA.config.model_switch_history
  # ---------------------------------------------------------------------------
  model_switch_history: summarize

  # ---------------------------------------------------------------------------
  # Concurrency Configuration
  # Controls automatic MCP server parallelization.
  # Access: AIA.config.concurrency.auto, etc.
  # ---------------------------------------------------------------------------
  concurrency:
    auto: false
    threshold: 2
    mcp_timeout: 120

  # ---------------------------------------------------------------------------
  # Context Files (set at runtime)
  # Access: AIA.config.context_files (array of file paths)
  # ---------------------------------------------------------------------------
  context_files: []
