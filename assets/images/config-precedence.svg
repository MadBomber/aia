<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
  <title id="t">AIA configuration precedence</title>
  <desc id="d">Seven configuration layers stacked from lowest priority (built-in defaults) at the bottom to highest (/config directives) at the top. A -c config file replaces the personal file, project file and environment layers.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .label { fill: #f5f5f5; font-size: 15px; font-weight: 600; }
    .sub { fill: #c9d1d9; font-size: 12px; }
    .axis { fill: #8b949e; font-size: 12px; }
    .note { fill: #e3b341; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- priority axis -->
  <line x1="40" y1="395" x2="40" y2="30" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="axis" x="22" y="215" transform="rotate(-90 22 215)" text-anchor="middle">higher priority wins</text>

  <!-- layers, bottom (lowest) to top (highest) -->
  <rect x="60" y="350" width="440" height="44" rx="6" fill="#30363d" stroke="#6e7681"/>
  <text class="label" x="76" y="370">1  Built-in defaults</text>
  <text class="sub" x="76" y="386">shipped with aia</text>

  <rect x="60" y="300" width="440" height="44" rx="6" fill="#1f3a5f" stroke="#388bfd"/>
  <text class="label" x="76" y="320">2  Personal config file</text>
  <text class="sub" x="76" y="336">~/.config/aia/aia.yml</text>

  <rect x="60" y="250" width="440" height="44" rx="6" fill="#1f3a5f" stroke="#388bfd"/>
  <text class="label" x="76" y="270">3  Project config file</text>
  <text class="sub" x="76" y="286">./config/aia.yml in the current directory</text>

  <rect x="60" y="200" width="440" height="44" rx="6" fill="#1b4332" stroke="#3fb950"/>
  <text class="label" x="76" y="220">4  Environment variables</text>
  <text class="sub" x="76" y="236">AIA_*  (AIA_LLM__TEMPERATURE, AIA_MODEL, ...)</text>

  <rect x="60" y="150" width="440" height="44" rx="6" fill="#3d2a5c" stroke="#a371f7"/>
  <text class="label" x="76" y="170">5  Command-line options</text>
  <text class="sub" x="76" y="186">-m, -t, --chat, ...</text>

  <rect x="60" y="100" width="440" height="44" rx="6" fill="#5a3a1a" stroke="#d29922"/>
  <text class="label" x="76" y="120">6  Prompt front matter</text>
  <text class="sub" x="76" y="136">applied when that prompt is loaded</text>

  <rect x="60" y="50" width="440" height="44" rx="6" fill="#5c1f2a" stroke="#f85149"/>
  <text class="label" x="76" y="70">7  /config directives</text>
  <text class="sub" x="76" y="86">typed during a chat session</text>

  <!-- -c bracket covering layers 2-4 -->
  <path d="M515,202 L530,202 L530,344 L515,344" fill="none" stroke="#e3b341" stroke-width="2"/>
  <text class="note" x="540" y="240">-c FILE replaces</text>
  <text class="note" x="540" y="256">layers 2, 3 and 4</text>
  <text class="note" x="540" y="272">(AIA_MODEL and</text>
  <text class="note" x="540" y="288">AIA_PLUGINS_DIR still apply)</text>
</svg>
