<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">How AIA turns a prompt file into the text sent to the model</title>
  <desc id="d">A prompt file passes through comment stripping, front matter extraction, shell expansion and ERB rendering. The rendered text is then wrapped with the role in front and skills, piped input and context files after it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
    <style>
      .box   { rx: 8; ry: 8; stroke-width: 2; }
      .label { font: 600 14px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; }
      .sub   { font: 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #b6c2cf; }
      .head  { font: 700 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #9aa4b2; letter-spacing: .06em; }
      .line  { stroke: #9aa4b2; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text class="head" x="20" y="28">1 · PROMPT FILE IS RENDERED</text>

  <rect class="box" x="20"  y="44" width="190" height="78" fill="#1f2a3a" stroke="#6e7b8f"/>
  <text class="label" x="115" y="76" text-anchor="middle">Strip comments</text>
  <text class="sub"   x="115" y="98" text-anchor="middle">&lt;!-- notes --&gt; removed</text>

  <rect class="box" x="235" y="44" width="190" height="78" fill="#1d2f4d" stroke="#4c8dff"/>
  <text class="label" x="330" y="76" text-anchor="middle">Front matter</text>
  <text class="sub"   x="330" y="98" text-anchor="middle">settings + parameters</text>

  <rect class="box" x="450" y="44" width="190" height="78" fill="#2d2a17" stroke="#e3b341"/>
  <text class="label" x="545" y="76" text-anchor="middle">Shell expansion</text>
  <text class="sub"   x="545" y="98" text-anchor="middle">$VAR  ${VAR}  $(command)</text>

  <rect class="box" x="665" y="44" width="195" height="78" fill="#2e1c33" stroke="#c678dd"/>
  <text class="label" x="762" y="76" text-anchor="middle">ERB rendering</text>
  <text class="sub"   x="762" y="98" text-anchor="middle">&lt;%= param %&gt;, directives</text>

  <path class="line" d="M210,83 H233" marker-end="url(#arrow)"/>
  <path class="line" d="M425,83 H448" marker-end="url(#arrow)"/>
  <path class="line" d="M640,83 H663" marker-end="url(#arrow)"/>

  <path class="line" d="M762,122 V150 H440 V170" marker-end="url(#arrow)"/>

  <text class="head" x="20" y="166">2 · AIA ASSEMBLES THE FINAL PROMPT</text>

  <rect class="box" x="20"  y="180" width="190" height="78" fill="#18302a" stroke="#3fb950"/>
  <text class="label" x="115" y="212" text-anchor="middle">Role</text>
  <text class="sub"   x="115" y="234" text-anchor="middle">--role, placed first</text>

  <rect class="box" x="235" y="180" width="410" height="78" fill="#2e1c33" stroke="#c678dd"/>
  <text class="label" x="440" y="212" text-anchor="middle">Rendered prompt text</text>
  <text class="sub"   x="440" y="234" text-anchor="middle">output of step 1</text>

  <rect class="box" x="670" y="180" width="190" height="78" fill="#33201a" stroke="#f0883e"/>
  <text class="label" x="765" y="206" text-anchor="middle">Appended after</text>
  <text class="sub"   x="765" y="226" text-anchor="middle">--skill content</text>
  <text class="sub"   x="765" y="244" text-anchor="middle">piped STDIN · context files</text>

  <path class="line" d="M210,219 H233" marker-end="url(#arrow)"/>
  <path class="line" d="M645,219 H668" marker-end="url(#arrow)"/>

  <text class="sub" x="440" y="288" text-anchor="middle">The assembled text is what the model receives.</text>
</svg>
